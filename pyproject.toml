[project]
name = "mineintel"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
  "python-multipart>=0.0.9",
  "requests>=2.31.0",
  "pandas>=2.2.0",
  "pdfplumber>=0.11.0",
  "pypdf>=4.2.0",
  "numpy>=1.26.0",
  "openpyxl>=3.1.0",
  "python-docx>=1.1.0",
  "reportlab>=4.0.0",
  "Pillow>=10.0.0",
  "psycopg2-binary>=2.9.9",
]

[tool.vercel]
entrypoint = "backend.main:app"

[tool.vercel.fastapi.static]
cdn = true
