version: '3.8'

services:
  mineintel-backend:
    build: .
    container_name: mineintel-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - MINEINTEL_LOCAL_MODEL_QWEN25=qwen2.5:7b
      - MINEINTEL_LOCAL_MODEL_QWEN2_VL=qwen2.5vl:7b
      # Required database configuration - MUST be set in environment or .env
      - DATABASE_URL=${DATABASE_URL:-}
      # Required authentication configuration - MUST be set in environment or .env
      - MINEINTEL_OFFICER_ID=${MINEINTEL_OFFICER_ID:-}
      - MINEINTEL_AUTH_PASSWORD=${MINEINTEL_AUTH_PASSWORD:-}
      - MINEINTEL_JWT_SECRET=${MINEINTEL_JWT_SECRET:-}
      # Secure CORS - define explicitly in .env (e.g. https://your-vercel-app.vercel.app)
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      # Optional: Persist uploads/outputs locally if needed. 
      # (Uncomment below to mount local directories instead of using ephemeral container storage)
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
    depends_on:
      ollama:
        condition: service_started
    networks:
      - mineintel-net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    # Ollama intentionally NOT exposing ports to the host machine for security
    # If host access is strictly required, uncomment the ports block:
    # ports:
    #  - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - mineintel-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # NOTE: The deploy block above assumes NVIDIA GPU presence.
    # If deploying on CPU only, remove or comment out the 'deploy' block.

networks:
  mineintel-net:
    driver: bridge

volumes:
  ollama_data:
